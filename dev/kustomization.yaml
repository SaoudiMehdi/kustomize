apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
images:
  - name: ghcr.io/saoudimehdi/spring-petclinic
    newName: ghcr.io/saoudimehdi/spring-petclinic
    newTag: 4.0.1-SNAPSHOT
patches:
  - path: replicas.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: spring-petclinic
  - path: patch-routing.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: spring-petclinic
  - patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /tp7
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: spring-petclinic